# Local development stack for Tycheon. Not a production topology.
#   make up    start and wait for health
#   make down  stop and delete volumes
#
# Credentials here are deliberately weak, local-only placeholders. They are safe
# to commit because nothing in this file is ever reachable off localhost.

name: tycheon-dev

services:
  postgres:
    # Run registry, backtest results and leaderboard metadata.
    image: postgres:16-alpine
    container_name: tycheon-postgres
    environment:
      POSTGRES_USER: tycheon
      POSTGRES_PASSWORD: tycheon  # pragma: allowlist secret
      POSTGRES_DB: tycheon
      # Deterministic collation so ordering is identical across machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tycheon -d tycheon"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    # Forecast cache and job queue.
    image: redis:7-alpine
    container_name: tycheon-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    # S3-compatible object store for Parquet panels, forecasts and model cards.
    # API on :9000, console on :9001.
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: tycheon-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: tycheon-local
      MINIO_ROOT_PASSWORD: tycheon-local-dev  # pragma: allowlist secret
    ports:
      - "9000:9000"   # S3 API — TYCHEON_S3_ENDPOINT_URL
      - "9001:9001"   # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio-setup:
    # One-shot: create the dev bucket so examples work on a fresh stack.
    # Exits 0 when done; `docker compose up --wait` tolerates a completed
    # one-shot service.
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: tycheon-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 tycheon-local tycheon-local-dev &&
        mc mb --ignore-existing local/tycheon-dev &&
        echo "bucket tycheon-dev ready"
    restart: "no"

  jaeger:
    # All-in-one tracing backend speaking OTLP. UI on :16686.
    image: jaegertracing/all-in-one:1.62.0
    container_name: tycheon-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC  — OTEL_EXPORTER_OTLP_ENDPOINT
      - "4318:4318"     # OTLP HTTP
      - "14269:14269"   # admin / health
    # No healthcheck: this image ships no shell or HTTP client to probe itself
    # with. `make health` probes :16686 and :14269 from the host instead.

volumes:
  postgres-data:
  redis-data:
  minio-data:
