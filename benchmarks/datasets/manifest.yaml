# Dataset manifest. Every benchmark names one dataset from here, and the manifest's hash is
# recorded in each published result, so a number can always be traced to the data under it.
#
# Rules (AGENTS.md): only redistributable data is committed or generated by default; real
# market data is fetched by the user from their own licensed source and never redistributed.
schema_version: 1
datasets:
  sample-synthetic-daily:
    description: >
      Deterministic synthetic daily series (GBM, GARCH, two-regime volatility, jumps),
      generated on demand from fixed seeds. Not market data: results on it test the
      machinery, not any claim about markets.
    kind: synthetic
    synthetic: true
    redistributable: true
    frequency: 1D
    generator: tycheon.data.sample
    symbols: [SYN-GBM, SYN-GARCH, SYN-REGIME, SYN-JUMP]
    license: Generated from fixed seeds; freely redistributable under Apache-2.0.

  user-csv-daily:
    description: >
      Your own daily bars, one CSV per symbol (columns: timestamp, open, high, low, close,
      volume). Point-in-time safety depends on you supplying an ``available_at`` column or
      accepting the conservative default (bar end).
    kind: user-license
    synthetic: false
    redistributable: false
    frequency: 1D
    format: csv
    license: >
      Your own data under your own licence. Tycheon never ships or redistributes it, and
      results computed from it should only be published if your licence allows that.
    how_to_fetch: >
      Export bars from a source you are licensed to use into a directory as SYMBOL.csv, then
      run ``python -m benchmarks.run --config <config> --data-dir <that directory> --execute``.
      See docs/tutorials/run-the-benchmark.md.
