# The smallest honest benchmark: three synthetic series, one horizon, three folds.
# `make benchmark-small` validates this config today and will run it once the T3
# walk-forward engine lands. The data is synthetic (see tycheon.data.sample): there
# is no real market data in this repository, so no ticker appears here.
name: small
description: Smoke-sized leaderboard config for CI and local development.

# Generated deterministically on demand; nothing is committed or redistributed.
dataset: sample-synthetic-daily
universe:
  - SYN-GBM
  - SYN-GARCH
  - SYN-REGIME

horizons: [5]          # trading days ahead
quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]

models:
  - kronos-small

# random-walk is mandatory: every published number is read against doing
# nothing, with a Diebold-Mariano test on the difference.
baselines:
  - random-walk
  - drift
  - seasonal-naive

walk_forward:
  folds: 3
  train_window: 756      # ~3y of trading days
  test_window: 63        # ~1 quarter
  # Gap between train and test so a label cannot leak backwards across the
  # boundary. Mandatory; the runner refuses a config without it.
  embargo: 5

calibration:
  method: split_conformal
  target_coverage: 0.9
  report_reliability: true

costs:
  # Evaluation is honest about frictions, even on a smoke config.
  spread_bps: 2
  slippage_bps: 1
