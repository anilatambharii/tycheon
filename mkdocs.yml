site_name: Tycheon
site_description: Calibrated financial forecasting and risk. Kronos forecasts the path; Tycheon tells you how much to trust it.
site_url: https://anilatambharii.github.io/tycheon/
repo_url: https://github.com/anilatambharii/tycheon
repo_name: anilatambharii/tycheon
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 The Tycheon Authors - for research and risk analytics, not investment advice

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# The launch post is a draft for the maintainers, not part of the published site.
exclude_docs: |
  blog/

nav:
  - Home: index.md
  - Methodology: methodology.md
  - Tutorials:
      - Calibrated forecasts with Kronos: tutorials/calibrated-kronos.md
      - Run the benchmark: tutorials/run-the-benchmark.md
  - Calibration: calibration.md
  - Risk: risk.md
  - Agents: agents.md
  - Governance: governance.md
  - Serving: serving.md
  - Tycheon Cloud: cloud.md
  - Leaderboard: leaderboard/index.md
  - Benchmark methodology: benchmark-methodology.md
  - Releasing: releasing.md
  - Safety and compliance: safety.md
  - Model cards:
      - Overview: models/index.md
      - Kronos mini: models/kronos-mini.md
      - Kronos small: models/kronos-small.md
      - Kronos base: models/kronos-base.md
      - TimesFM 2.5: models/timesfm.md
      - Chronos-2: models/chronos-2.md
      - Random walk: models/random-walk.md
      - Drift: models/drift.md
      - Seasonal naive: models/seasonal-naive.md
      - ARIMA: models/arima.md
      - GARCH: models/garch.md
      - Residual-corrected: models/residual-corrected.md
      - Regime ensemble: models/regime-ensemble.md
  - Decisions:
      - 0001 Licensing and open core: adr/0001-licensing-and-open-core.md
      - 0002 Kronos integration: adr/0002-kronos-integration.md
      - 0003 Point-in-time data and the forecast contract: adr/0003-point-in-time-data-and-forecast-contract.md
      - 0004 Conformal calibration design: adr/0004-conformal-calibration-design.md
      - 0005 Risk and portfolio dependence: adr/0005-risk-and-portfolio-dependence.md
      - 0006 Walk-forward evaluation: adr/0006-walk-forward-evaluation.md
      - 0007 Keelgate integration: adr/0007-keelgate-integration.md
      - 0008 Agent architecture and the verifier: adr/0008-agent-architecture-and-the-verifier.md

watch:
  - src/tycheon
