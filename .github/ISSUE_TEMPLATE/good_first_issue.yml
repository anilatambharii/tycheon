name: Good first issue (maintainers)
description: For maintainers only. Write a small, well-scoped task for a new contributor.
title: "docs: "
labels: ["good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        **Maintainers only.** A good first issue is real, takes 1 to 3 hours, and tells a newcomer exactly where to look and when they are done. If you cannot name a file path that exists, it is not ready. Batch-created launch issues live in `docs/launch/good-first-issues.yaml`.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this matters, with repository paths (verify each one exists). Quote the line or section that is wrong or missing.
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: What to do
      description: Concrete steps. For code, say "write the failing test first" and name the test file.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist a reviewer can verify. Include "no number that is not in a result file" for anything that quotes results.
      value: |
        - [ ]
        - [ ] `make check` passes
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Maintainer checklist
      options:
        - label: Every path cited exists on `main`.
          required: true
        - label: It is small enough for 1 to 3 hours and needs no design decision.
          required: true
        - label: The body points to `make check` and `CONTRIBUTING.md`.
          required: true
        - label: It asks for no claim about returns or trading performance.
          required: true
