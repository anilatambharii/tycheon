# Two independent scanners: detect-secrets against a committed baseline (so a
# finding that is not already known fails the build) and gitleaks over history.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Scan tracked files against the committed baseline
        # This is the same entrypoint the pre-commit hook uses: it fails on a
        # finding that is not in the baseline and never rewrites the baseline.
        # (Comparing a re-scan with `git diff` cannot work -- every scan writes
        # a fresh `generated_at`.)
        run: |
          git ls-files -z | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline
      - name: Remind how to update the baseline
        if: failure()
        run: |
          echo "::error::New potential secrets found. Review each one, then run 'make secrets-baseline' and commit the updated .secrets.baseline."

  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # So the action can post its findings summary on the PR.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
