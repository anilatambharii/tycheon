# Two independent scanners: detect-secrets with a committed baseline (so a new
# finding fails the build) and gitleaks over the history.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: detect-secrets (baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Scan against the committed baseline
        run: |
          uv run detect-secrets scan --baseline .secrets.baseline
          git diff --exit-code .secrets.baseline || {
            echo "::error::New potential secrets found. Review them, then run 'make secrets-baseline' and commit the updated baseline.";
            exit 1;
          }

  gitleaks:
    name: gitleaks (history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
