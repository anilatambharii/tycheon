# Build the docs strictly and deploy them to GitHub Pages. Needs Pages enabled with the
# "GitHub Actions" source (Settings -> Pages). Pull requests only build (they never deploy).
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "mkdocs.yml", "benchmarks/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv run --group docs mkdocs build --strict
        env:
          UV_FROZEN: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
