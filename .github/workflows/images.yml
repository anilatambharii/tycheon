# Build -> scan -> sign -> push the container images, then deploy.
#
#   pull request   build and scan only: nothing is pushed or signed
#   push to main   build, scan, push, sign (cosign, keyless), then deploy to STAGING
#   tag v*         the same, then deploy to PRODUCTION after a human approves the `production` environment
#
# Every action is pinned by commit SHA. Images are pushed to ghcr.io/<owner>/ and signed with the
# workflow's own OIDC identity (no signing key is stored anywhere); the SBOM (SPDX, from syft) is
# attached to each image as a signed attestation. A scan with a fixable HIGH or CRITICAL finding
# fails the build before anything is pushed.
#
# Deploy jobs are skipped, not failed, until the environment is configured (see docs/ops/cicd.md).
name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - ".dockerignore"
      - "ee/dashboard/**"
      - "ee/control_plane/**"
      - "ee/finetune/**"
      - "src/**"
      - pyproject.toml
      - uv.lock
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write       # push to ghcr.io
      id-token: write       # keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,        image: tycheon-api,       context: ".",            file: Dockerfile,                target: api,   torch: cpu,   suffix: "",      big: false }
          - { name: cloud,      image: tycheon-cloud,     context: ".",            file: Dockerfile,                target: cloud, torch: cpu,   suffix: "",      big: false }
          - { name: cloud-cuda, image: tycheon-cloud,     context: ".",            file: Dockerfile,                target: cloud, torch: cu124, suffix: "-cuda", big: true }
          - { name: dashboard,  image: tycheon-dashboard, context: ee/dashboard,    file: ee/dashboard/Dockerfile,   target: "",    torch: cpu,   suffix: "",      big: false }
    outputs:
      pushed: ${{ steps.meta.outputs.push }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Free disk space (the CUDA image is several gigabytes)"
        if: matrix.big
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Work out tags
        id: meta
        run: |
          repo="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          short="${GITHUB_SHA::12}"
          tags="${repo}:sha-${short}${{ matrix.suffix }}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="${tags},${repo}:${GITHUB_REF_NAME#v}${{ matrix.suffix }}"; fi
          if [ "${GITHUB_REF}" = refs/heads/main ]; then tags="${tags},${repo}:main${{ matrix.suffix }}"; fi
          push=false; if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then push=true; fi
          echo "repo=${repo}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "push=${push}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.meta.outputs.push == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build (loaded locally, to be scanned before anything is pushed)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: TORCH_BACKEND=${{ matrix.torch }}
          load: true
          push: false
          tags: scan-target:${{ matrix.name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: "Scan (fails on any fixable HIGH or CRITICAL vulnerability)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:${{ matrix.name }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: scan-target:${{ matrix.name }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}

      - name: Push
        id: push
        if: steps.meta.outputs.push == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: TORCH_BACKEND=${{ matrix.torch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.meta.outputs.push == 'true'

      - name: Sign and attest the SBOM (keyless)
        if: steps.meta.outputs.push == 'true'
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${REPO}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate "sbom-${{ matrix.name }}.spdx.json" "${REPO}@${DIGEST}"

      - name: Verify what was just signed
        if: steps.meta.outputs.push == 'true'
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${REPO}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/images\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
          echo "signature verified for ${REPO}@${DIGEST}"
          mkdir -p digests && echo "${REPO}@${DIGEST}" > "digests/${{ matrix.name }}.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.meta.outputs.push == 'true'
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}.txt
          retention-days: 14

  deploy-staging:
    name: deploy to staging
    needs: build
    # skipped (not failed) until a staging cluster is configured: set the repository variable
    # STAGING_ENABLED=true and the STAGING_KUBECONFIG secret on the `staging` environment
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "digest-*", path: digests, merge-multiple: true }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: "Deploy (atomic, so a failed upgrade rolls itself back)"
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          umask 077; echo "${KUBECONFIG_B64}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"; export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          dig() { cut -d@ -f2 "digests/$1.txt"; }
          helm upgrade --install tycheon deploy/helm/tycheon -n tycheon --create-namespace \
            -f deploy/helm/tycheon/values-saas.yaml -f deploy/helm/environments/staging.yaml \
            --set image.api.digest="$(dig api)" --set image.cloud.digest="$(dig cloud)" \
            --set image.cloudCuda.digest="$(dig cloud-cuda)" --set image.dashboard.digest="$(dig dashboard)" \
            --atomic --timeout 25m --history-max 10
          helm test tycheon -n tycheon --timeout 5m
      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 "${{ vars.STAGING_URL }}/health"
          curl -fsS -o /dev/null -w 'dashboard %{http_code}\n' "${{ vars.STAGING_DASHBOARD_URL }}/login"

  deploy-production:
    name: deploy to production
    needs: [build, deploy-staging]
    # only a release tag, only after staging, and only once a reviewer approves the `production`
    # environment (configure required reviewers in Settings > Environments)
    if: >-
      startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_ENABLED == 'true' && needs.deploy-staging.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "digest-*", path: digests, merge-multiple: true }
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: vars.PRODUCTION_RDS_INSTANCE != ''
        with:
          role-to-assume: ${{ vars.PRODUCTION_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PRODUCTION_AWS_REGION }}
      - name: "Snapshot the database first (the way back from a bad migration)"
        if: vars.PRODUCTION_RDS_INSTANCE != ''
        run: |
          aws rds create-db-snapshot --db-instance-identifier "${{ vars.PRODUCTION_RDS_INSTANCE }}" \
            --db-snapshot-identifier "pre-${GITHUB_REF_NAME//./-}-${GITHUB_RUN_ID}"
          aws rds wait db-snapshot-available --db-snapshot-identifier "pre-${GITHUB_REF_NAME//./-}-${GITHUB_RUN_ID}"
      - name: Deploy (atomic)
        id: deploy
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
        run: |
          umask 077; echo "${KUBECONFIG_B64}" | base64 -d > "${RUNNER_TEMP}/kubeconfig"; export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          dig() { cut -d@ -f2 "digests/$1.txt"; }
          helm upgrade --install tycheon deploy/helm/tycheon -n tycheon --create-namespace \
            -f deploy/helm/tycheon/values-saas.yaml -f deploy/helm/environments/production.yaml \
            --set image.api.digest="$(dig api)" --set image.cloud.digest="$(dig cloud)" \
            --set image.cloudCuda.digest="$(dig cloud-cuda)" --set image.dashboard.digest="$(dig dashboard)" \
            --atomic --timeout 30m --history-max 10
          helm test tycheon -n tycheon --timeout 5m
      - name: "Roll back the release if the smoke test fails"
        run: |
          export KUBECONFIG="${RUNNER_TEMP}/kubeconfig"
          if ! curl -fsS --retry 5 --retry-delay 5 "${{ vars.PRODUCTION_URL }}/health"; then
            helm rollback tycheon -n tycheon --wait --timeout 15m
            echo "::error::smoke test failed; rolled back. Database migrations are NOT undone automatically: see docs/ops/runbooks/bad-migration.md"
            exit 1
          fi
