# Blocks a PR that pulls in a vulnerable or licence-incompatible dependency.
# AGENTS.md: ask before adding heavy, GPU-only or copyleft dependencies.
name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        # Non-blocking until the repository Dependency graph setting is turned
        # on; the action errors out without it and would red-flag every PR.
        # Remove this line once it is enabled -- see issue #2. While it is here
        # this check gates nothing.
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Copyleft licences would stop downstream proprietary integrations,
          # which is the whole point of the Apache-2.0 core. See ADR 0001.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0
