    **What to do**

    Add `tests/test_calibration_plots.py` (new file). Start with `pytest.importorskip("matplotlib")` (the `report` extra). Build a `CalibrationReport` as the `scores` and `report` fixtures in `tests/test_calibration_diagnostics.py` do (copy the two fixtures; module-scoped fixtures are not shared across files). For each of the three functions assert: the result starts with `<svg`, parses as XML (`xml.etree.ElementTree.fromstring`), contains no `<metadata>` element and no `#000000`. Add one test that `new_figure` raises `OptionalDependencyError` with the install hint when matplotlib cannot be imported (monkeypatch `importlib.import_module` as seen in `require_matplotlib`).

