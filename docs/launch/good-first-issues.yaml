# Good first issues for the launch. Reviewed and created by a maintainer with docs/launch/create-issues.sh.
# Each entry: title, labels, body. Labels are defined in docs/launch/labels.yaml.
# A path followed by (new file) in a body is a file the issue asks the contributor to create.
- title: 'docs: replace the ''not yet measured'' baseline comparison on the drift model card'
  labels:
  - good first issue
  - documentation
  - 'area: docs'
  - 'area: models'
  body: |
    **Context**

    `docs/models/drift.md` ends with a "Baseline comparison" section that still says the comparison is "not yet measured" and arrives "in Phase T3". The walk-forward engine has since shipped and `benchmarks/results/small/0.1.0.json` is a published run (benchmark `small`, three synthetic series, horizon 5, 108 pooled origins). In that file `drift` has MASE 1.024 against the random walk and one-sided Diebold-Mariano p-values of 0.850 (squared error) and 0.905 (CRPS), verdict "indistinguishable from the random walk". It is one of the baselines in the run.

    **What to do**

    Rewrite only the "Baseline comparison" section of `docs/models/drift.md`: say which result file and run it comes from, that the data are synthetic and the sample small, quote the MASE and both DM p-values exactly as they appear in `benchmarks/results/small/0.1.0.json` (key `diebold_mariano_vs_random_walk`), state the verdict in plain words, and link `docs/leaderboard/index.md`. Do not imply skill, and keep the disclaimer line at the bottom of the card.

    **Acceptance criteria**

    - Every number in the new text appears in `benchmarks/results/small/0.1.0.json` and is attributed to that file.
    - The text says the data are synthetic and the sample is small, and does not claim the model beats (or reliably loses to) the random walk.
    - `tests/test_forecaster_contract.py` (which checks the required card headings) and `uv run --group docs mkdocs build --strict` both pass.

    **How to check**

    Run `make check` (lint, format check, `mypy --strict`, fast tests). Without `make` (for example on Windows) run the same steps directly:
    `uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -m "not slow"`. For docs changes also run `uv run --group docs mkdocs build --strict`.

    **Before you start**

    Read [CONTRIBUTING.md](CONTRIBUTING.md) (ground rules, Conventional Commits, the PR template and its leakage/baseline checklist). Say in a comment that you are taking the issue. Expected effort: 1 to 3 hours. Nothing here asks for, or should contain, a claim about returns or trading performance. Tycheon is for research and risk analytics; it is not investment advice.
