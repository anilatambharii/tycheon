    **What to do**

    For each `uses:` line in `.github/workflows/ci.yml`, resolve the tag you want to the commit it points to (for an annotated tag, dereference it: `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and, if `object.type` is `tag`, `gh api repos/<owner>/<repo>/git/tags/<sha>`), pin to that SHA, and keep the tag as a trailing comment (`uses: actions/checkout@<sha> # v4.x.y`). Keep the same major version unless you have a reason to change it, and say in the PR what you ran to resolve each SHA.

    **Acceptance criteria**

    - No `uses:` line in `ci.yml` refers to a tag or branch (local `./` actions excepted).
