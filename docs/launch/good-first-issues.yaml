- title: 'test: property-based leakage test for filter_as_of with Hypothesis'
  labels:
  - good first issue
  - tests
  - 'area: data'
  - help wanted
  body: |
    **Context**

    `filter_as_of` in `src/tycheon/data/asof.py` is the core point-in-time filter. `tests/test_data_asof.py` covers it with example-based tests marked `@pytest.mark.leakage`; the file does not use Hypothesis, although it is already a test dependency (`tests/test_governance.py` imports it).

    **What to do**

    Add a property-based test to `tests/test_data_asof.py`, marked `@pytest.mark.leakage`, that builds a bars frame with random `available_at` offsets (use the `bars_factory` fixture from `tests/conftest.py` as a base and perturb `available_at`) and a random `as_of`, and asserts: (1) every returned row has `available_at <= as_of`, (2) the result contains no duplicate index entries, (3) applying `filter_as_of` twice equals applying it once, (4) a row whose `available_at` is after `as_of` never appears. Function-scoped fixtures need `HealthCheck.function_scoped_fixture` suppressed (see how `tests/test_governance.py` configures `settings`).

    **Acceptance criteria**

    - The test runs in under five seconds.
    - It fails if you deliberately change `<=` to `<` in the filter (try it locally and say so; do not commit that change).
    - `uv run pytest tests/test_data_asof.py --no-cov -q` passes.

