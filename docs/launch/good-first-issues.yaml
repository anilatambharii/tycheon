- title: 'feat(serve): add a --version flag to tycheon-serve and tycheon-mcp'
  labels:
  - good first issue
  - enhancement
  - 'area: serve'
  - tests
  body: |
    **Context**

    `src/tycheon/serve/cli.py` defines `serve_main` and `mcp_main` with argparse parsers that have no `--version`, so there is no quick way to ask an installed server which release it is. `tycheon.__version__` exists (`src/tycheon/__init__.py`) and `GET /health` already returns it.

    **What to do**

    Write the failing test first in `tests/test_serve.py`: calling `serve_main(["--version"])` and `mcp_main(["--version"])` exits with code 0 and prints `tycheon-serve <version>` / `tycheon-mcp <version>` using `tycheon.__version__` (argparse's `action="version"` raises `SystemExit(0)`; use `pytest.raises(SystemExit)` and `capsys`). Then add the flag to both parsers.

    **Acceptance criteria**

    - Both commands print their name and `tycheon.__version__`.
    - `uv run mypy` passes (the repo runs `mypy --strict` on `src/`).
    - The flag appears in the `--help` output.

    **How to check**

    Run `make check` (lint, format check, `mypy --strict`, fast tests). Without `make` (for example on Windows) run the same steps directly:
