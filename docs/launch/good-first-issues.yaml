- title: 'fix(serve): give TYCHEON_APPROVER_TOKENS a clear error instead of a raw JSON traceback'
  labels:
  - good first issue
  - bug
  - 'area: serve'
  - tests
  body: |
    **Context**

    `_approver_tokens` in `src/tycheon/serve/cli.py` parses the `TYCHEON_APPROVER_TOKENS` environment variable with `json.loads` and indexes `entry["approver_id"]` and `entry["tenant_id"]`. Malformed JSON, a non-object value or a missing key currently surfaces as a `JSONDecodeError` or `KeyError` traceback. `_approver_tokens` has no test (`grep -rn _approver_tokens tests` finds nothing).

    **What to do**

    Test first (new tests in `tests/test_serve.py`): a valid value parses with `max_tier` defaulting to `"ONE_CLICK"`; malformed JSON, a top-level list, and an entry without `tenant_id` each produce a one-line message on stderr and exit code 2 from `serve_main` (mirror how the existing `TYCHEON_API_KEYS` error is reported in the same function). Then implement the handling. Never print the token values in an error message.

    **Acceptance criteria**

    - All three failure cases give a clear message and exit code 2 without a traceback and without echoing secrets.
    - The success case is covered by a test.
    - `uv run mypy` and the new tests pass.

    **How to check**

    Run `make check` (lint, format check, `mypy --strict`, fast tests). Without `make` (for example on Windows) run the same steps directly:
    `uv run ruff check . && uv run ruff format --check . && uv run mypy && uv run pytest -m "not slow"`. For docs changes also run `uv run --group docs mkdocs build --strict`.

