[build-system]
requires = ["hatchling>=1.32", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "tycheon"
version = "0.3.0"
description = "Calibrated financial forecasting and risk. Kronos forecasts the path; Tycheon tells you how much to trust it."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "third_party/kronos/LICENSE"]
authors = [{ name = "The Tycheon Authors" }]
keywords = [
    "forecasting", "time-series", "conformal-prediction", "calibration",
    "risk", "value-at-risk", "expected-shortfall", "backtesting", "quant",
    "kronos", "fintech",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
# Core stays installable without a GPU, a foundation model or a web stack:
# arrays, columnar storage, a local query engine, validation, and the honest
# baselines that every evaluation is required to report against.
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "pyarrow>=18,<26",
    "duckdb>=1.1,<2",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
    "arch>=8.0,<9",
    "lightgbm>=4.5,<5",
    "pydantic>=2.11,<3",
]

# The README uses repo-relative links and images (good on GitHub, broken on PyPI, which does not
# resolve repo paths). At build time only, rewrite them to absolute GitHub URLs; the README in the
# repository is not touched. Images go to raw.githubusercontent.com, other links to blob/main.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\])\((?!https?://)([^)\s]+)\)'
replacement = '\1(https://raw.githubusercontent.com/anilatambharii/tycheon/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/anilatambharii/tycheon/blob/main/\1)'

[project.scripts]
tycheon-serve = "tycheon.serve.cli:serve_main"
tycheon-mcp = "tycheon.serve.cli:mcp_main"

# Tycheon's financial metrics, registered for Keelgate's outcome-metric plugin point. The group
# name is part of Keelgate's integration contract. Keelgate's OutcomeMetric protocol is not
# implemented yet, so these classes follow a small shape of Tycheon's own: see tycheon.metrics.
[project.entry-points."keelgate.outcome_metrics"]
crps = "tycheon.metrics:CRPS"
coverage = "tycheon.metrics:IntervalCoverage"
mase_vs_rw = "tycheon.metrics:MASEvsRandomWalk"
dm_test = "tycheon.metrics:DieboldMarianoVsRandomWalk"
qlike = "tycheon.metrics:QLIKE"

[project.urls]
Homepage = "https://github.com/anilatambharii/tycheon"
Repository = "https://github.com/anilatambharii/tycheon"
Issues = "https://github.com/anilatambharii/tycheon/issues"
Documentation = "https://github.com/anilatambharii/tycheon/tree/main/docs"

# Heavy and optional pieces. AGENTS.md: heavy models live behind extras, so a
# `pip install tycheon` never drags in a multi-gigabyte torch build.
[project.optional-dependencies]
# Kronos is vendored (third_party/kronos, ADR 0002), so this extra carries only
# what its source imports at module load: torch, einops, tqdm and the Hugging
# Face stack that downloads the safetensors weights.
kronos = [
    "torch>=2.5,<3",
    # huggingface-hub 2.x exists but is deliberately excluded: upstream Kronos was
    # written against 0.33 and its PyTorchModelHubMixin loading is untested on 2.x.
    "huggingface-hub>=0.26,<1",
    "safetensors>=0.4,<1",
    "einops>=0.8,<1",
    "tqdm>=4.66,<5",
]
# TimesFM 2.5 (Apache-2.0). The `torch` extra of the upstream package is what
# provides TimesFM_2p5_200M_torch; the default install has no backend.
timesfm = [
    "timesfm[torch]>=3.0.2,<4",
]
# Chronos-2 lives in chronos-forecasting 2.x (Apache-2.0).
chronos = [
    "chronos-forecasting>=2.3,<3",
]
# CUDA wheels are not on PyPI proper. This extra installs the accelerator-side
# libraries; point your resolver at the PyTorch index for the CUDA build, e.g.
#   uv pip install "tycheon[gpu]" --torch-backend=cu124
gpu = [
    "torch>=2.5,<3",
    "accelerate>=1.1,<2",
]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    # Keelgate's MCP adapter needs mcp>=2.3, so this extra follows it (T0 pinned mcp<2).
    "mcp>=2.3,<3",
    "keelgate[mcp]>=0.1,<0.2",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.2,<9",
    "boto3>=1.35,<2",
]
# Diagnostic plots and the HTML risk report (inline SVG, no external resources).
report = [
    "matplotlib>=3.9,<4",
]
# The governed agentic workflow (Phase T4). Keelgate is imported only from
# src/tycheon/governance/ (enforced by tests/test_architecture.py). Keelgate is not on PyPI
# yet: [tool.uv.sources] below pins a commit for development and CI, and a published
# tycheon[agents] needs `keelgate>=0.1,<0.2` to exist on PyPI first.
agents = [
    "tycheon[serve]",
    "keelgate>=0.1,<0.2",
]

# Tycheon Cloud (proprietary, /ee). Never imported by src/tycheon. Postgres access is asyncpg
# (Apache-2.0) with plain SQL: no ORM, and not psycopg (LGPL).
ee = [
    "tycheon[agents,report]",
    "asyncpg>=0.30,<1",
    "stripe>=13,<16",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=44,<48",
]
# Real AWS KMS for envelope encryption; the local dev provider needs no cloud.
ee-aws = [
    "tycheon[ee]",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "hypothesis>=6.168",
    "mypy>=2.4",
    "ruff>=0.16",
    "pre-commit>=4.6",
    "detect-secrets>=1.5",
    "pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]
# Plotting for examples/. Deliberately NOT in any published extra, and
# yfinance is deliberately absent from the lock altogether: it is for
# local development only and is installed by hand (see the provider).
examples = [
    "matplotlib>=3.9",
]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tycheon"]

# Upstream Kronos lives at third_party/kronos in the repo (AGENTS.md layout) and
# is shipped inside the package so an installed wheel can find it. The loader in
# tycheon.models.kronos.vendor looks in both places.
[tool.hatch.build.targets.wheel.force-include]
"third_party/kronos" = "tycheon/_vendor/kronos"

[tool.hatch.build.targets.sdist]
include = ["src/tycheon", "third_party", "tests", "benchmarks", "README.md", "LICENSE"]

# --------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["ee/dashboard", "deploy", "third_party"]

[tool.ruff.lint]
select = [
    "E", "W",     # pycodestyle
    "F",          # pyflakes
    "I",          # isort
    "N",          # pep8-naming
    "UP",         # pyupgrade
    "B",          # bugbear
    "A",          # builtins shadowing
    "C4",         # comprehensions
    "DTZ",        # timezone-aware datetimes — as_of correctness depends on this
    "T20",        # no print() in library code
    "SIM",        # simplify
    "TC",         # type-checking imports
    "PTH",        # pathlib
    "RUF",
    "S",          # bandit — security lint
    "ASYNC",
    "LOG", "G",   # logging correctness
    "PL",         # pylint subset
    "TRY",        # exception antipatterns
    "ARG",        # unused arguments
    "PGH",        # no blanket type: ignore
    "ERA",        # commented-out code
    "NPY",        # numpy legacy API
    "PD",         # pandas antipatterns (inplace, chained assignment, .values)
]
ignore = [
    "ISC001",     # conflicts with the formatter
    "TRY003",     # long messages outside exception class — we want readable errors
    "PLR0913",    # many arguments; model and risk signatures are wide by nature
    "PLR2004",    # `n < 2` reads better inline than as a named constant
]

[tool.ruff.lint.per-file-ignores]
# Tests import optional extras inside functions (after importorskip) and dispatch
# fixtures with a long if-chain on purpose.
"tests/**" = ["S101", "ARG", "ERA001", "PLC0415", "PLR0911", "PLR0917"]
"ee/control_plane/tycheon_cp/errors.py" = ["N818"]  # ApiProblem reads better than ApiProblemError
"ee/tests/**" = ["E501", "S101", "ARG", "ERA001", "PLC0415", "PLR0911", "PLR0917", "S105", "S106", "S608"]
# Foundation models are optional extras: importing torch, timesfm or chronos at
# module level would make `import tycheon.models` require them, so those imports are
# deliberately inside functions.
"src/tycheon/models/**" = ["PLC0415"]
# Plotting needs the optional matplotlib extra, imported lazily.
"src/tycheon/_svg.py" = ["PLC0415"]
"src/tycheon/**/plots.py" = ["PLC0415"]
"src/tycheon/risk/report.py" = ["PLC0415"]
"src/tycheon/services/analytics.py" = ["PLC0415"]  # kronos and matplotlib are optional
"src/tycheon/governance/_llm.py" = ["PLC0415"]  # provider SDKs are optional
"src/tycheon/serve/cli.py" = ["PLC0415"]  # uvicorn is imported only when serving
"src/tycheon/governance/_telemetry.py" = ["PLC0415"]  # the OTel SDK is only needed to export
# The leaderboard harness and the examples are CLIs: they report to stdout by design.
"benchmarks/**" = ["T20", "PLC0415"]
"examples/**" = ["T20", "PLC0415"]
"ee/scripts/**" = ["T20", "PLC0415", "E501", "PLR0915"]  # a linear walkthrough script

[tool.ruff.lint.isort]
known-first-party = ["tycheon", "benchmarks", "tycheon_cp", "tycheon_ft"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.format]
docstring-code-format = true

# -------------------------------------------------------------------- mypy
# AGENTS.md: `mypy --strict` on src/.
[tool.mypy]
python_version = "3.11"
files = ["src"]  # ee/ is checked by `make ee-types` (it needs the ee extra installed)
strict = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]
pretty = true

[[tool.mypy.overrides]]
# Optional extras and untyped scientific packages are not installed in the
# default dev env.
module = [
    "accelerate.*", "arch.*", "asyncpg.*", "boto3.*", "botocore.*", "chronos.*", "duckdb.*", "einops.*",
    "huggingface_hub.*", "kronos.*", "lightgbm.*", "mcp.*", "safetensors.*", "scipy", "scipy.*",
    "statsmodels.*", "timesfm.*", "torch.*", "yfinance.*",
]
ignore_missing_imports = true

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]  # ee/tests need Postgres and the ee extra: see `make ee-test`
pythonpath = ["ee/control_plane", "ee/finetune"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    # Keelgate ships a pytest11 plugin that pytest loads at startup, before any test imports
    # duckdb; it imports regopy, and regopy-before-duckdb aborts the process on Linux. Tycheon
    # uses keelgate.testing directly and none of the plugin's fixtures.
    "-p",
    "no:keelgate",
    "--cov=tycheon",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
markers = [
    "slow: long-running tests (model downloads, full backtests); deselect with -m 'not slow'",
    "integration: needs `make up` services (Postgres/Redis/MinIO)",
    "leakage: point-in-time correctness guards; every data path must have one",
    "eval: agent evals (trajectory, planted verifier errors, injection); run with `make evals`",
    "postgres: needs a real Postgres via TYCHEON_TEST_DATABASE_URL; row-level security cannot be tested on anything else",
]
filterwarnings = [
    "error",
    # huggingface_hub still calls hf_xet.download_files(), which hf_xet now deprecates. It is a
    # third-party warning raised during a model download (the slow tests), not our code, and as
    # an error it aborts the download (transformers then reports a misleading "Can't load the
    # model"). Ignore exactly this message; every other warning stays an error.
    'ignore:hf_xet\.download_files\(\) is deprecated:DeprecationWarning',
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["src/tycheon"]
branch = true
# The vendored upstream Kronos is executed (it is imported) but is not ours to cover:
# counting it would measure Kronos, not Tycheon, and would swing the gate with every
# upstream update. Our behaviour on it is pinned by the hash and equality tests instead.
omit = ["*/third_party/*", "*/_vendor/*"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    '@(abc\.)?abstractmethod',
    "@overload",
    "if __name__ == .__main__.:",
]

# ----------------------------------------------------------------------- uv
# Dev and CI only (tool.uv is not published metadata). On Linux, PyPI's torch
# drags in ~3 GB of CUDA libraries; the CPU index keeps CI and `make setup`
# small. Windows and macOS wheels from PyPI are already CPU/MPS builds.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# uv-only (not part of published package metadata): resolve Keelgate from its public git
# repository at a pinned commit until it is released to PyPI. AGENTS.md: "PyPI, or a pinned git
# tag until published"; the repository has no tags yet, so this is a commit.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
keelgate = { git = "https://github.com/anilatambharii/keelgate", rev = "0852b148f1fcaba825dd5b8d94a218dcd1b63f89" }  # pragma: allowlist secret
